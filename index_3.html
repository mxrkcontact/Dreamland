function getMove(ci,kind){
 const C=CHARS[ci];let m;
 if(kind==='special')m=Object.assign({},SPECIAL[C.special]);
 else if(kind==='ult')m=Object.assign({},ULT[C.ult]);
 else{m=Object.assign({},BASE[kind]);const fs=C.scale>1.2?1.25:C.weapon==='daggers'?.8:1;
  m.s=Math.round(m.s*fs);m.r=Math.round(m.r*fs);m.dmg*=C.str;m.kb*=Math.sqrt(C.str);
  if(kind==='heavy')Object.assign(m,C.heavy)}
 m.kind=kind;return m;
}
const isAtk=F=>!!F.mv&&(F.act==='light'||F.act==='heavy'||F.act==='special'||F.act==='ult');
function poseOf(F){
 const k=F.at,a=F.act;
 if(a==='ko')return lp(HIT,KO,ease(clamp(k/20,0,1)));
 if(a==='hit')return lp(HIT,IDLE,clamp(k/(F.stunMax||12),0,1)*.5);
 if(a==='block')return BLOCK;
 if(a==='dash'){const p=Object.assign({},F.dashD>=0?DASHF:DASHB);if(F.dashD>=0){const ph=k*.5;p.fl1+=Math.sin(ph)*.4;p.bl1-=Math.sin(ph)*.4}return p}
 if(isAtk(F)){
  const m=F.mv,W1=m.pw||L_WIND,H1=m.ph||L_HIT;
  if(m.leap&&!F.ground&&k>=m.s)return Object.assign({},H_WIND,{fl1:1.1,fl2:.1,bl1:.4,bl2:-.6});
  let p;
  if(k<m.s)p=lp(IDLE,W1,ease(k/m.s));
  else if(k<m.s+m.a)p=lp(W1,H1,clamp((k-m.s+1)/2,0,1));
  else p=lp(H1,IDLE,ease(clamp((k-m.s-m.a)/m.r,0,1)));
  const act=k>=m.s&&k<m.s+m.a;
  if(m.spinFx&&act){p.wa=1.57+(k-m.s)*.55;p.fa1=p.wa;p.fa2=p.wa}
  if(m.flurry&&act){const q=Math.sin((k-m.s)*1.2);p.wa=1.57+q*1.2;p.fa2=1.4+q*.8;p.ba2=1.6-q*.8}
  if(F.ground===false&&!m.leap){p.fl1=1.1;p.fl2=.1;p.bl1=.4;p.bl2=-.6}
  return p;
 }
 if(F.ground===false)return Object.assign({},F.flying?FLY:JUMP);
 const p=Object.assign({},IDLE);
 if(a==='walk'){const ph=k*.22;p.fl1=Math.sin(ph)*.55;p.fl2=p.fl1-.45*Math.max(0,Math.sin(ph+1.6));
  p.bl1=-Math.sin(ph)*.55;p.bl2=p.bl1-.45*Math.max(0,-Math.sin(ph+1.6));p.hy=Math.abs(Math.cos(ph))*.8;return p}
 p.hy=1+Math.sin(k*.07)*.8;return p;
}

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 const f=v=>clamp(Math.round(a<0?v*(1+a):v+(255-v)*a),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`}
function Lp(c,a,b,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(const p of pts)c.lineTo(p.x,p.y);c.closePath();c.fill()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.5,r),0,7);c.fill()}
function rc(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x-w/2,y-h/2,w,h)}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,7);c.fill()}
const mix=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
function txt(s,x,y,size,col,al='left',sh='#000'){ctx.font=size+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
 if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function wrap(t,n){const w=t.split(' '),out=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){out.push(l.trim());l=x}else l+=' '+x}if(l.trim())out.push(l.trim());return out}
function btn(x,y,w,h,label,hi,dis){ctx.fillStyle=dis?'rgba(20,30,40,.7)':hi?'rgba(212,169,55,.38)':'rgba(8,40,60,.82)';ctx.fillRect(x,y,w,h);
 ctx.strokeStyle=dis?'#334':hi?'#f0d080':'#3a8aa0';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);txt(label,x+w/2,y+(h-8)/2+1,8,dis?'#567':hi?'#fff2c0':'#cfe6ee','center')}
const fmt=v=>v>=10000?(v/1000).toFixed(1)+'k':String(Math.round(v));
function drawCrown(x,y,k){const p=(u,v)=>({x:x+u*k,y:y+v*k});poly(ctx,[p(-9,0),p(-9,-7),p(-5,-3),p(0,-10),p(5,-3),p(9,-7),p(9,0)],'#3a2a00');
 poly(ctx,[p(-8,-1),p(-8,-6),p(-4.5,-2.5),p(0,-9),p(4.5,-2.5),p(8,-6),p(8,-1)],'#ffd040');circ(ctx,x,y-4*k,1.3*k,'#e02040');circ(ctx,x-5*k,y-2*k,.9*k,'#40a0ff');circ(ctx,x+5*k,y-2*k,.9*k,'#40e080')}

// ---------------------------------------------------------- CHARAKTER-RENDERING (volle Koerper)
function skel(x,y,f,s,p){
 const lu=11,ll=11,T=17,au=9,al=9;
 const ext=Math.max(lu*Math.cos(p.fl1)+ll*Math.cos(p.fl2),lu*Math.cos(p.bl1)+ll*Math.cos(p.bl2));
 const pt=(b,a,l)=>({x:b.x+f*Math.sin(a)*l*s,y:b.y+Math.cos(a)*l*s});
 const hip={x,y:y-ext*s+p.hy*s};
 const neck=pt(hip,Math.PI-p.lean,T),head=pt(neck,Math.PI-p.lean,5.5),sh=pt(neck,-p.lean,2);
 const la=p.lean*.5;
 const fe=pt(sh,p.fa1+la,au),fh=pt(fe,p.fa2+la,al),be=pt(sh,p.ba1+la,au),bh=pt(be,p.ba2+la,al);
 const fk=pt(hip,p.fl1,lu),ff=pt(fk,p.fl2,ll),bk=pt(hip,p.bl1,lu),bf=pt(bk,p.bl2,ll);
 return{hip,neck,head,sh,fe,fh,be,bh,fk,ff,bk,bf,wa:p.wa+la,ba:p.ba2+la+.5};
}
function drawWeapon(c,type,h,a,f,s,C){
 const dx=f*Math.sin(a),dy=Math.cos(a),nx=f*Math.cos(a),ny=-Math.sin(a);
 const Q=(t,u=0)=>({x:h.x+dx*t*s+nx*u*s,y:h.y+dy*t*s+ny*u*s});
 const steel='#c9d0d9',dark='#2e2826',wood='#6a4428';
 switch(type){

function slotLabel(s){if(sel.ctrl==='cpu')return s?'CPU':'DU';if(sel.ctrl==='local')return'SPIELER '+(s+1);if(sel.ctrl==='solo')return'DU';return(s===mySlot()?'DU - P':'P')+(s+1)}
function setCur(side,i){if(sel.lock[side]||sel.c[side]===i)return;sel.c[side]=i;sel.pv[side]=mkPrev(i);sel.desc=i;sfx('tick');syncPick(side)}
function lockCur(side,v=true){if(sel.lock[side]===v)return;sel.lock[side]=v;sfx(v?'select':'tick');if(v){const p=sel.pv[side];p.mv=getMove(p.ci,'special');p.act='special';p.at=0}syncPick(side)}
function syncPick(side){if(NET.role==='guest'&&side===NET.slot){sel.mine=20;sendHost({t:'pick',c:sel.c[side],l:sel.lock[side]})}else if(NET.role==='host')broadcastLobby()}
function canStart(){const pr=[0,1,2].filter(s=>sel.present[s]);if(sel.gm==='duel'&&pr.length!==2)return false;return pr.every(s=>sel.lock[s])}
function doStart(){
 if(sel.gm==='waves'){if(NET.role==='host')sendAll({t:'start',gm:'waves',c:sel.c,pr:sel.present});startWaves(sel.c,sel.present.slice())}
 else{const opp=sel.ctrl==='online'?[1,2].find(s=>sel.present[s]):1;
  if(NET.role==='host'){sendAll({t:'start',gm:'duel',a:sel.c[0],b:sel.c[opp],opp});mode='host'}else mode=sel.ctrl;
  startMatch(sel.c[0],sel.c[opp]);G.opp=opp}}
function backToLobby(){if(NET.role==='host'){sendAll({t:'sel'});openLobby('online',true)}else if(NET.role==='guest'){}else openLobby(sel?sel.ctrl:'cpu',true)}
function stepPrev(p){p.at++;
 if(p.act==='idle'&&p.at>45){const seq=['light','heavy','special'];p.mv=getMove(p.ci,seq[p.demo++%3]);p.act=p.mv.kind;p.at=0}
 else if(p.mv&&p.at>=p.mv.s+Math.min(p.mv.a,30)+p.mv.r+10){p.act='idle';p.mv=null;p.at=0}}
function shareRoom(){const url=location.origin+location.pathname+'?raum='+NET.code;
 if(navigator.share)navigator.share({title:'Davud',text:'Komm in meine Atlantis-Party! Code: '+NET.code,url}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>say('Link kopiert!')).catch(()=>say('Code: '+NET.code));}
function stepSelect(){
 if(sel.mine>0)sel.mine--;
 sel.pv.forEach(stepPrev);
 const me=mySlot(),online=sel.ctrl==='online';
 const ctl=sel.ctrl==='local'?[[0,'p1'],[1,'p2']]:[[me,'p1'],[me,'p2']];
 for(const[side,set]of ctl){const nav=set==='p1'?['KeyA','KeyD']:['ArrowLeft','ArrowRight'];
  if(anyP([nav[0]]))setCur(side,(sel.c[side]+7)%8);if(anyP([nav[1]]))setCur(side,(sel.c[side]+1)%8);
  const ok=set==='p1'?['KeyF','Space']:['Comma','Numpad1'];if(sel.ctrl!=='local')ok.push('Enter');else if(set==='p2')ok.push('Enter');
  if(anyP(ok)){if(!sel.lock[side])lockCur(side);else if(online&&NET.role==='host'&&side===0&&canStart())doStart()}}
 const mside=sel.ctrl==='local'?(sel.lock[0]?1:0):me;
 for(let i=0;i<8;i++){if(inR(PX(i),16,52,42)){if(mouse.moved&&!sel.lock[mside])sel.desc=i;if(mouse.click){if(sel.c[mside]===i&&!sel.lock[mside])lockCur(mside);else{setCur(mside,i);sel.desc=i}}}}
 if(clickR(6,250,80,16)||anyP(['Escape'])){if(online){quitToMenu();return}
  if(sel.lock[1]&&sel.ctrl==='local')lockCur(1,false);else if(sel.lock[0])sel.lock=[false,false,false];else{scene='menu';return}}
 if(online&&NET.role==='host'&&clickR(170,250,140,16)){sel.gm=sel.gm==='waves'?'duel':'waves';sfx('tick');broadcastLobby()}
 if(online&&clickR(364,1,48,12))shareRoom();
 if(clickR(394,250,80,16)){
  if(online&&NET.role==='host'&&sel.lock[0]){if(canStart())doStart();else say(sel.gm==='duel'?'Duell braucht genau 2 Spieler':'Alle muessen BEREIT sein')}
  else if(sel.ctrl==='local'){if(!sel.lock[0])lockCur(0);else if(!sel.lock[1])lockCur(1)}
  else lockCur(me,!sel.lock[me])}
 if(sel.ctrl==='cpu'&&sel.lock[0]&&!sel.lock[1]){sel.cpu++;if(sel.cpu%4===0){const i=Math.random()*8|0;if(i!==sel.c[1]){sel.c[1]=i;sel.pv[1]=mkPrev(i);sfx('tick')}}if(sel.cpu>40)lockCur(1)}
 if(!online&&lobbySlots().every(s=>sel.lock[s])){if(++sel.st>45)doStart()}else sel.st=0;
 if(toast&&toast.l>0)toast.l--;
}
function drawSelect(){
 drawBG();ctx.fillStyle='rgba(2,12,22,.62)';ctx.fillRect(0,0,W,H);
 const online=sel.ctrl==='online',me=mySlot();
 const title={solo:'WELLEN-MODUS - SOLO',cpu:'DUELL - GEGEN CPU',local:'DUELL - 2 SPIELER',online:'ONLINE-LOBBY'}[sel.ctrl];
 txt(title,6,3,8,'#f0d080');
 if(online){txt('CODE: '+NET.code,358,3,8,'#fff2c0','right');btn(364,1,48,12,'TEILEN',false);txt(sel.gm==='waves'?'WELLEN':'DUELL',474,3,8,'#9fe8ff','right')}
 for(let i=0;i<8;i++){const x=PX(i),y=16,C=CHARS[i];const g=ctx.createLinearGradient(0,y,0,y+42);g.addColorStop(0,'#0e3a50');g.addColorStop(1,'#04121c');ctx.fillStyle=g;ctx.fillRect(x,y,52,42);
  ctx.save();ctx.beginPath();ctx.rect(x,y,52,42);ctx.clip();const k=1.05;drawFighter(ctx,C,x+26,y+5+50*C.scale*k,1,IDLE,k);ctx.restore();
  ctx.strokeStyle=i===sel.desc?'#9fe8ff':'#2a5a6a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,51,41);
  lobbySlots().forEach((s,j)=>{if(!sel.present[s]||sel.c[s]!==i)return;ctx.strokeStyle=PCOL[s];ctx.lineWidth=2;const o=j*2;ctx.strokeRect(x+1+o,y+1+o,50-o*2,40-o*2)})}
 const slots=lobbySlots(),pw=W/slots.length;
 slots.forEach((s,j)=>{const cx=pw*j+pw/2,x0=pw*j;
  if(!sel.present[s]){ctx.strokeStyle='#2a5a6a';ctx.setLineDash([3,3]);ctx.strokeRect(x0+8.5,66.5,pw-17,120);ctx.setLineDash([]);txt('WARTE AUF',cx,110,8,'#5a8a9a','center');txt('SPIELER '+(s+1),cx,122,8,'#5a8a9a','center');if(online)txt('Code: '+NET.code,cx,140,8,'#9fe8ff','center');return}
  const C=CHARS[sel.c[s]],p=sel.pv[s];
  txt(slotLabel(s),cx,64,8,PCOL[s],'center');txt(C.name,cx,75,8,'#fff','center');txt(C.passive,cx,86,8,'#6fc8a0','center');
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,189,24,4,0,0,7);ctx.fill();
  drawFighter(ctx,C,cx,188,j===slots.length-1&&slots.length>1?-1:1,poseOf(p),slots.length>2?1.15:1.3);
  if(sel.lock[s])txt('BEREIT!',cx,98,16,'#f0d080','center','#402800')});
 const D=CHARS[sel.desc];ctx.fillStyle='rgba(2,16,28,.85)';ctx.fillRect(0,194,W,53);
 txt(D.name+' - '+D.title,8,197,8,'#fff');txt(D.origin,W-8,197,8,'#7a9aaa','right');
 txt('SPEZIAL: '+D.sname,8,208,8,'#9fd8ff');txt(sel.gm==='duel'?'ULTI: '+D.uname:PASSIVE[D.passive],W-8,208,8,sel.gm==='duel'?'#ffb040':'#6fc8a0','right');
 wrap(D.lore,58).slice(0,3).forEach((l,i)=>txt(l,8,219+i*9,8,'#b8cdd6'));
 btn(6,250,80,16,'ZURUECK',false);
 if(online&&NET.role==='host')btn(170,250,140,16,'MODUS: '+(sel.gm==='waves'?'WELLEN':'DUELL'),false);
 else if(online)txt(NET.status&&!NET.status.startsWith('Verbunden')?NET.status:'Host waehlt Modus',W/2,254,8,'#7a9aaa','center');
 else txt(sel.ctrl==='local'?'P1: A/D + F    P2: PFEILE + ,':'Tippen = waehlen, nochmal = bereit',W/2,254,8,'#7a9aaa','center');
 const ml=sel.lock[me],rl=online&&NET.role==='host'&&ml?'START':ml&&sel.ctrl!=='local'?'BEREIT X':'BEREIT';
 btn(394,250,80,16,rl,rl==='START'?canStart():!ml,rl==='START'&&!canStart());
 if(online&&NET.role==='host'&&NET.status&&!NET.status.startsWith('Raum offen'))txt(NET.status,W/2,40,8,'#ff9a80','center');
 if(toast&&toast.l>0){ctx.fillStyle='rgba(60,10,20,.88)';ctx.fillRect(80,150,320,16);txt(toast.t,W/2,154,8,'#ffb0b0','center')}
}

// ---------------------------------------------------------- HAUPTSCHLEIFE
function step(){
 sfxCount=0;
 for(const b of bubbles){b.y+=b.vy;if(b.y<-4){b.y=H+4;b.x=Math.random()*W}}
 for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l--;if(p.g>0&&p.y>=p.gy){p.y=p.gy;p.vx=0;p.vy=0}}
 parts=parts.filter(p=>p.l>0);if(parts.length>700)parts.splice(0,parts.length-700);
 for(const t of texts){t.y-=.45;t.l--}texts=texts.filter(t=>t.l>0);if(texts.length>60)texts.splice(0,texts.length-60);
 for(const f of fxs)f.l--;fxs=fxs.filter(f=>f.l>0);
 if(shake>0)shake=Math.max(0,shake-.5);
 MUS.want=scene==='fight'||scene==='waves'?'battle':'menu';
 if(scene==='menu')stepMenu();else if(scene==='controls')stepControls();else if(scene==='online')stepOnline();else if(scene==='joining')stepJoining();
 else if(scene==='select')stepSelect();else if(scene==='fight'&&G)stepFight();else if(scene==='waves'&&Wv)stepWaves();else if(scene==='stats')stepStats();
}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
 if(scene==='menu')drawMenu();else if(scene==='controls')drawControls();else if(scene==='online')drawOnline();else if(scene==='joining')drawJoining();
 else if(scene==='select')drawSelect();else if(scene==='fight'&&G)drawFight();else if(scene==='waves'&&Wv)drawWaves();else if(scene==='stats')drawStats();}
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=DT){acc-=DT;try{step()}catch(e){console.error(e)}tick++;pressed.clear();mouse.click=false;mouse.moved=false}
 try{draw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
{const q=new URLSearchParams(location.search).get('raum');if(q)setTimeout(()=>joinRoom(q),300)}
</script>
